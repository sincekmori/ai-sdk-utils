packages:
  - "packages/*"
  - "docs"
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.0"
  - "@ai-sdk/cohere@4.0.0"
  - "@ai-sdk/deepseek@3.0.0"
  - "@ai-sdk/gateway@4.0.0"
  - "@ai-sdk/google@4.0.0"
  - "@ai-sdk/groq@4.0.0"
  - "@ai-sdk/mistral@4.0.0"
  - "@ai-sdk/openai-compatible@3.0.0"
  - "@ai-sdk/openai@4.0.0"
  - "@ai-sdk/perplexity@4.0.0"
  - "@ai-sdk/provider-utils@5.0.0"
  - "@ai-sdk/provider@4.0.0"
  - "@ai-sdk/xai@4.0.0"
  - ai@7.0.0
overrides:
  # @astrojs/starlight 0.41.x declares satteri ^0.9.1 but only `import type`s
  # from it, while @astrojs/markdown-satteri >= 0.3.7 (via astro/mdx) already
  # runs satteri 0.10.x — two copies make starlight's shipped .ts sources fail
  # tsc. Give starlight the same range its sibling declares so the two never
  # fork again. Scoped to starlight < 0.42.0 (which declares ^0.10.3 itself and
  # ships .d.ts), so the entry goes dead once 0.42 is adopted — delete it then.
  "@astrojs/starlight@<0.42.0>satteri": "^0.10.3"
